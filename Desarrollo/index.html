
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>ProyectoM1_SandyHurtado</title>
</head>

<body>

    <header class="header-blob">
        <h1>Generador de Paletas</h1>
    </header>

    <main>

        <div class="menu-paleta">

            <label id="Tamaño">Cantidad:</label>

             <select id="select-Cantidad">
                <option value="6">6 Colores</option>
                <option value="8">8 Colores</option>
                <option value="9">9 Colores</option>
             </select>

              <div class="format">
                <label id="btn-Formato">Formato de Color:</label>
              </div>

              <select id="select-Formato">
                <option value="HSL">HSL</option>
                <option value="HEX">HEX</option>
              </select>

              <div class="button">
                 <button id="btn-Generar"> Generar paleta </button>

                   <div class="guardar-container">
                     <button id="btn-Guardar">💾 Guardar paleta </button>

                      <div id="paletas-Guardadas" class="guardadas">

                          <button id="btn-MostrarGuardadas" class="btn-guardadas">
                         Paletas guardadas ▼
                          </button>

                          <div id="lista-Guardadas" class="lista-guardadas"></div>

                     </div>
                 </div>
             </div>
        <div id="toast">¡Paleta Generada!</div>
        <div id="contenedor"></div>
         <!--Botón de nueva sesion añadido-->
          <section class="nueva">
          <button id="btnNuevaSesion">Nueva Paleta</button>
          </section>
    </main>
  

    <footer class="pie-pagina">

        <div class="contenido-footer">

            <p class="autor-info">
                &copy; 2026 Sandy Hurtado
            </p>

            <div class="redes-contacto">

                <a href="mailto:sandyhurtado21@gmail.com"
                   class="enlace-contacto"
                   title="Enviar correo a Sandy">

                    <span class="icono">🪄</span>
                    <span class="texto">Correo</span>

                </a>

                <a href="https://github.com/hurtadosandy21-ops"
                   class="enlace-contacto"
                   target="_blank"
                   rel="noopener noreferrer"
                   title="Perfil de GitHub">

                    <span class="icono">⭐</span>
                    <span class="texto">GitHub</span>

                </a>

                <a href="https://www.linkedin.com/in/sandy-hurtado-a40aa1421/"
                   class="enlace-contacto"
                   target="_blank"
                   rel="noopener noreferrer"
                   title="Perfil de LinkedIn">

                    <span class="icono">🐧</span>
                    <span class="texto">LinkedIn</span>

                </a>

            </div>

        </div> 
    </footer>
    <!-- Modal-->>
    <div id="modal-confirmacion" class="modal-overlay">
        <div class="modal-content">
            <h3>¿Estás seguro?</h3>
            <p>¿Realmente deseas eliminar esta paleta de colores?</p>
            
            <!-- Casilla de verificación No volver a preguntar -->
            <label class="modal-checkbox-label">
                <input type="checkbox" id="chk-no-mostrar">
                <span>No volver a preguntar</span>
            </label>
            <!-- Botones de Acción -->
            <div class="modal-botones">
                <button id="btn-modal-si" class="btn-modal btn-si">Sí, eliminar</button>
                <button id="btn-modal-no" class="btn-modal btn-no">No</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>

</body>
</html>
