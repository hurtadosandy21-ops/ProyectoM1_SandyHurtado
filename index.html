<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProyectoM1_SandyHurtado</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header>
        <h1>Creación de Paleta de Colores</h1>
        <p>Selecciona y crea tu Combinación de Colores</p> 
    </header>

    <main> 
        <section class="controles">
            <label for="tamano-paleta">Cantidad de colores:</label>
            <select id="tamano-paleta">
                <option value="6">6 Colores</option>
                <option value="8">8 Colores</option>
                <option value="9">9 Colores</option>
            </select>

            <button id="btn-generar">Generar paleta</button>
            <button id="btn-guardar-actual" class="btn-secundario">💾 Guardar esta paleta</button>

            <!-- UN SOLO BOTÓN DESPLEGABLE TIPO SELECTOR CON LA LISTA -->
            <div class="saved-dropdown-container">
                <button id="saved-dropdown-btn" class="dropdown-btn">
                    Paletas Guardadas <span id="saved-count">(0)</span> ▼
                </button>
                
                <div id="saved-palettes-dropdown" class="dropdown-content hidden">
                    <!-- Las paletas guardadas se cargarán aquí como opciones visuales -->
                </div>
            </div>
        </section>

        <section id="contenedor-paleta" class="paleta" aria-live="polite">
            <!-- Los colores aparecerán aquí -->
        </section>
    </main>

    <footer class="pie-pagina">
    <div class="contenido-footer">
        <p class="autor-info">&copy; 2026 Sandy Hurtado — Full Stack Web Developer</p>
        
        <div class="redes-contacto">
            <!-- Al hacer clic se abre Gmail o la app de correo predeterminada -->
            <a href="mailto:sandyhurtado21@gmail.com" class="enlace-contacto" title="Enviar correo a Sandy">
                <span class="icono">🪄</span> 
                <span class="texto">Correo</span>
            </a>

            <!-- Al hacer clic se abre tu perfil de GitHub -->
            <a href="https://github.com/hurtadosandy21-ops" class="enlace-contacto" target="_blank" rel="noopener noreferrer" title="Perfil de GitHub">
                <span class="icono">⭐</span> 
                <span class="texto">GitHub</span>
               
            </a>

            <!-- Al hacer clic se abre tu perfil de LinkedIn -->
            <a href="https://www.linkedin.com/in/sandy-hurtado-a40aa1421/" class="enlace-contacto" target="_blank" rel="noopener noreferrer" title="Perfil de LinkedIn">
                <span class="icono">🐧</span> 
                <span class="texto">LinkedIn</span>
            </a>
        </div>
    </div>
</footer>

    <script src="./app.js"></script>
</body>
</html>
